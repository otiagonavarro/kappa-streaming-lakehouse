[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kappa-simulator"
version = "0.2.0"
description = "Shop application simulator: transactional use cases on Postgres plus Avro clickstream."
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "confluent-kafka[avro]>=2.3",
    "faker>=24.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "testcontainers[postgres]>=4.0",
]

[project.scripts]
simulator = "simulator.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
simulator = ["schemas/*.avsc"]

[tool.pytest.ini_options]
testpaths = ["../../tests/simulator"]
